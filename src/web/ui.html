<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PRTS // FMUX TACTICAL TERMINAL</title>
<style>
  :root {
    --bg: #090b0e;
    --bg-grid: rgba(0, 212, 255, 0.035);
    --surface: #11151b;
    --surface-2: #161c24;
    --surface-3: #1c242f;
    --border: #253040;
    --border-bright: #3a4c63;
    --text: #eef3f8;
    --muted: #7f8ea3;
    --cyan: #00d4ff;
    --cyan-soft: rgba(0, 212, 255, 0.12);
    --amber: #facc15;
    --amber-soft: rgba(250, 204, 21, 0.14);
    --green: #10b981;
    --green-soft: rgba(16, 185, 129, 0.15);
    --red: #ff3b5c;
    --red-soft: rgba(255, 59, 92, 0.15);
    --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--sans); overflow: hidden;
  }
  body {
    display: flex; flex-direction: column;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* ---- Arknights PRTS Top Command Strip ---- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 16px; min-height: 52px;
    background: linear-gradient(180deg, #131922 0%, #0e1218 100%);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
    position: relative; z-index: 10;
  }
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
    background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan) 18%, transparent 18%, transparent 82%, var(--amber) 82%, var(--amber) 100%);
    opacity: 0.7;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-weight: 700; letter-spacing: 0.12em; font-size: 14px;
  }
  .emblem {
    width: 18px; height: 18px; border: 1.5px solid var(--cyan); transform: rotate(45deg);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .emblem::before { content: ""; width: 6px; height: 6px; background: var(--cyan); }
  .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.16em; display: block; font-weight: 500; }
  .sse-dot { width: 7px; height: 7px; background: var(--red); display: inline-block; margin-right: 4px; }
  .sse-dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* Primary Mode Switcher: SESSIONS vs AGENTBOARD */
  .mode-nav { display: flex; gap: 4px; align-items: center; }
  .mode-btn {
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    padding: 7px 14px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); cursor: pointer;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    transition: all .15s;
  }
  .mode-btn:hover { color: var(--text); border-color: var(--border-bright); }
  .mode-btn.active { background: var(--cyan); color: #071017; border-color: var(--cyan); }

  .telemetry { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; }
  .clock { color: var(--cyan); letter-spacing: 0.08em; }
  .op-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  }
  .op-avatar { width: 18px; height: 18px; object-fit: cover; border: 1px solid var(--cyan); }

  button {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--cyan); background: var(--surface-3); }
  button.primary { background: var(--cyan); border-color: var(--cyan); color: #061018; font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button.amber { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
  button.danger { background: var(--red-soft); border-color: var(--red); color: var(--red); }

  /* ---- Main Tactical Viewport ---- */
  #viewSessions { flex: 1; display: grid; grid-template-columns: 310px 1fr; min-height: 0; }
  #viewBoard { flex: 1; display: none; flex-direction: column; min-height: 0; position: relative; }
  #viewBoard iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }

  /* Left Roster Sidebar */
  aside {
    border-right: 1px solid var(--border); background: rgba(15, 19, 25, 0.92);
    display: flex; flex-direction: column; min-height: 0;
  }
  .aside-bar {
    padding: 9px 12px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--muted);
  }
  .session-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .session-card {
    position: relative; padding: 10px 12px; background: var(--surface);
    border: 1px solid var(--border); border-left: 3px solid var(--border-bright);
    cursor: pointer; transition: all .15s;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  }
  .session-card:hover { background: var(--surface-2); border-color: var(--border-bright); }
  .session-card.active {
    background: linear-gradient(90deg, rgba(0, 212, 255, 0.12) 0%, var(--surface-2) 100%);
    border-color: var(--cyan); border-left-color: var(--cyan);
  }
  .session-card.st-working { border-left-color: var(--green); }
  .session-card.st-background { border-left-color: var(--cyan); }
  .session-card.st-blocked { border-left-color: var(--amber); }

  .s-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .s-name { font-family: var(--mono); font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; padding: 2px 6px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); text-transform: uppercase;
  }
  .tag.working { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .tag.background { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-soft); }
  .tag.blocked { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
  .tag.attached { border-color: var(--cyan); background: var(--cyan); color: #061018; font-weight: 700; }
  .s-meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .s-preview { margin-top: 6px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Right Tactical Workspace */
  section.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ws-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .ws-id { display: flex; align-items: center; gap: 8px; font-family: var(--mono); }
  .ws-id strong { font-size: 15px; letter-spacing: 0.05em; }
  .tabs { display: flex; gap: 6px; }
  .tab { background: transparent; color: var(--muted); border-color: var(--border); }
  .tab.active { background: var(--cyan-soft); color: var(--cyan); border-color: var(--cyan); }
  .badge { background: var(--cyan); color: #071018; padding: 0 5px; font-size: 10px; font-weight: 700; }

  .panel { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .hazard-banner {
    border: 1px solid var(--amber); background: var(--amber-soft); padding: 12px 14px;
    position: relative; display: flex; flex-direction: column; gap: 8px;
  }
  .hazard-banner::before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px;
    background: repeating-linear-gradient(-45deg, var(--amber) 0 8px, #11151b 8px 16px);
  }
  .bg-strip {
    border: 1px solid var(--cyan); background: var(--cyan-soft); color: var(--cyan);
    padding: 8px 12px; font-family: var(--mono); font-size: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .msg-user {
    align-self: flex-end; max-width: 82%; background: #17273a; border: 1px solid var(--cyan);
    padding: 10px 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  }
  .msg-bot {
    align-self: flex-start; max-width: 92%; background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--cyan); padding: 12px 15px; font-size: 14px; line-height: 1.62;
    white-space: pre-wrap; word-break: break-word;
  }
  .terminal-box {
    background: #07090c; color: #d8e4f0; border: 1px solid var(--border);
    padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    overflow: auto; white-space: pre-wrap; word-break: break-all;
    min-height: 240px; max-height: 58vh; margin: 0;
  }
  .keybar { display: flex; flex-wrap: wrap; gap: 6px; }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .task-tile {
    border: 1px solid var(--border); background: var(--surface); padding: 10px 12px;
    cursor: pointer; border-left: 3px solid var(--border-bright);
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  }
  .task-tile.running { border-left-color: var(--cyan); }
  .task-tile.done { border-left-color: var(--green); }
  .task-tile.error { border-left-color: var(--red); }
  .task-tile.selected { border-color: var(--cyan); background: var(--cyan-soft); }
  .task-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; }
  .task-desc { margin-top: 6px; font-size: 12px; color: var(--muted); word-break: break-word; }

  .composer {
    display: flex; gap: 10px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .composer textarea {
    flex: 1; resize: none; min-height: 40px; max-height: 120px; padding: 9px 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: 14px var(--sans); outline: none;
  }
  .composer textarea:focus { border-color: var(--cyan); }
  .empty { margin: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-align: center; }

  dialog {
    border: 1px solid var(--cyan); background: var(--surface); color: var(--text);
    width: min(460px, 92vw); padding: 20px;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  }
  dialog::backdrop { background: rgba(4, 7, 11, 0.72); backdrop-filter: blur(2px); }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .field input, .field select { padding: 8px 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 13px var(--sans); }

  @media (max-width: 820px) {
    header { flex-wrap: wrap; padding: 8px 10px; gap: 8px; }
    .clock { display: none; }
    #viewSessions { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
    .aside-bar { display: none; }
    .session-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px; }
    .session-card { min-width: 210px; max-width: 240px; flex-shrink: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="emblem"></span>
    <div>
      <span>PRTS // FMUX</span>
      <span class="brand-sub"><span id="sseDot" class="sse-dot"></span>TACTICAL AGENT TERMINAL</span>
    </div>
  </div>
  <nav class="mode-nav">
    <button class="mode-btn active" data-mode="sessions">01 // SESSIONS</button>
    <button id="boardModeBtn" class="mode-btn" data-mode="board">02 // AGENTBOARD</button>
  </nav>
  <div class="telemetry">
    <span id="clock" class="clock">--:--:--</span>
    <span id="attachedChip" class="tag">BOT: CONCIERGE</span>
    <span id="opChip" class="op-chip" style="display:none"></span>
    <button id="detachBtn" style="display:none">DETACH</button>
    <button id="newBtn" class="primary">+ DEPLOY</button>
    <button id="logoutBtn" style="display:none">LOGOUT</button>
  </div>
</header>

<main id="viewSessions">
  <aside>
    <div class="aside-bar"><span>ACTIVE UNITS</span><span id="unitCount">00</span></div>
    <div id="sessionList" class="session-list"></div>
  </aside>
  <section class="workspace">
    <div id="wsBar" class="ws-bar" style="display:none">
      <div class="ws-id">
        <strong id="wsTitle"></strong>
        <span id="wsKind" class="tag"></span>
        <span id="wsModel" class="tag" style="display:none"></span>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="chat">COMM // 对话</button>
        <button class="tab" data-tab="tasks">ASYNC // 后台任务 <span id="taskBadge" class="badge" style="display:none">0</span></button>
        <button class="tab" data-tab="term">TTY // 终端</button>
      </div>
      <div style="display:flex;gap:6px">
        <button id="attachBtn" class="primary">LINK FEISHU</button>
        <button id="escBtn" class="amber">ESC</button>
        <button id="killBtn" class="danger">TERMINATE</button>
      </div>
    </div>
    <div id="panel" class="panel"><div class="empty">// AWAITING OPERATOR SELECTION</div></div>
    <form id="composer" class="composer" style="display:none">
      <textarea id="input" rows="1" placeholder="输入指令发送至当前会话（Enter 发送，Shift+Enter 换行）"></textarea>
      <button type="submit" class="primary">TRANSMIT</button>
    </form>
  </section>
</main>

<section id="viewBoard">
  <iframe id="boardFrame" title="Embedded Agentboard"></iframe>
</section>

<dialog id="newDialog">
  <form id="newForm">
    <div style="font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:0.14em;margin-bottom:4px">PRTS // DEPLOY UNIT</div>
    <h3 style="margin:0 0 14px;font-size:17px">新建 / 恢复 Agent 会话</h3>
    <label class="field">RESUME ARCHIVE
      <select id="fResume"><option value="new">NEW SESSION // 新对话</option><option value="last">CONTINUE LAST // 继续目录最近一次对话</option></select>
    </label>
    <label class="field">AGENT CLASS
      <select id="fAgent"></select>
    </label>
    <label class="field">WORKSPACE CWD<input id="fCwd" value="~" /></label>
    <label class="field">CALLSIGN (OPTIONAL)<input id="fName" placeholder="留空自动分配代号" /></label>
    <label class="field">INITIAL DIRECTIVE (OPTIONAL)<input id="fPrompt" placeholder="可以留空" /></label>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
      <button type="button" id="cancelNew">CANCEL</button>
      <button type="submit" class="primary">DEPLOY & LINK</button>
    </div>
  </form>
</dialog>

<script>
const STATUS_LABEL = { working: 'ACTIVE', background: 'BG-OPS', blocked: 'WAIT-OP', idle: 'STANDBY', shell: 'SHELL' };
const state = { sessions: [], status: null, agents: [], user: null, authMode: 'local', agentboard: { enabled: true }, selectedKey: null, mode: 'sessions', tab: 'chat', selectedTaskId: null, boardLoaded: false };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

setInterval(() => { $('clock').textContent = new Date().toTimeString().slice(0, 8); }, 1000);
$('clock').textContent = new Date().toTimeString().slice(0, 8);

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) { location.reload(); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function selectedSession() {
  return state.sessions.find((s) => s.key === state.selectedKey) || null;
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
  $('viewSessions').style.display = mode === 'sessions' ? 'grid' : 'none';
  $('viewBoard').style.display = mode === 'board' ? 'flex' : 'none';
  if (mode === 'board' && !state.boardLoaded) {
    state.boardLoaded = true;
    $('boardFrame').src = '/agentboard/';
  }
}

document.querySelectorAll('.mode-btn').forEach((b) => { b.onclick = () => setMode(b.dataset.mode); });

function renderHeader() {
  const attached = state.status?.attached;
  $('attachedChip').textContent = attached ? `BOT: ${attached}` : 'BOT: CONCIERGE';
  $('attachedChip').className = attached ? 'tag attached' : 'tag';
  $('detachBtn').style.display = attached ? '' : 'none';
  $('boardModeBtn').style.display = state.agentboard?.enabled === false ? 'none' : '';
  if (state.user) {
    $('opChip').style.display = '';
    $('opChip').innerHTML = `${state.user.avatarUrl ? `<img class="op-avatar" src="${esc(state.user.avatarUrl)}" alt="" />` : ''}<span>${esc(state.user.name || 'OPERATOR')}</span>`;
  }
  $('logoutBtn').style.display = state.authMode === 'oidc' ? '' : 'none';
}

function renderSessions() {
  renderHeader();
  $('unitCount').textContent = String(state.sessions.length).padStart(2, '0');
  const list = $('sessionList');
  if (!state.sessions.length) {
    list.innerHTML = '<div class="empty" style="padding:20px">// NO ACTIVE TMUX UNITS</div>';
    return;
  }
  if (!state.selectedKey || !selectedSession()) state.selectedKey = state.sessions[0].key;
  list.innerHTML = state.sessions.map((s) => {
    const active = s.key === state.selectedKey ? ' active' : '';
    const bgTag = s.runningTasks > 0 ? `<span class="tag background">BG:${s.runningTasks}</span>` : '';
    const attTag = s.attached ? '<span class="tag attached">LINKED</span>' : '';
    return `<div class="session-card st-${esc(s.status)}${active}" data-key="${esc(s.key)}">
      <div class="s-head">
        <span class="s-name">${esc(s.name)}</span>
        <span class="tag ${esc(s.status)}">${esc(STATUS_LABEL[s.status] || s.status)}</span>
      </div>
      <div class="s-meta">
        <span class="tag">${esc(s.kind)}</span>${s.model ? `<span class="tag">${esc(s.model)}</span>` : ''}${bgTag}${attTag}
      </div>
      <div class="s-preview">${esc(s.note || s.lastText || s.title || s.cwd)}</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.session-card').forEach((el) => {
    el.onclick = () => {
      state.selectedKey = el.dataset.key;
      state.selectedTaskId = null;
      renderSessions();
      renderWorkspace();
    };
  });
}

async function renderWorkspace() {
  if (state.mode !== 'sessions') return;
  const s = selectedSession();
  $('wsBar').style.display = s ? '' : 'none';
  $('composer').style.display = s ? '' : 'none';
  if (!s) {
    $('panel').innerHTML = '<div class="empty">// AWAITING OPERATOR SELECTION</div>';
    return;
  }
  $('wsTitle').textContent = s.name;
  $('wsKind').textContent = s.kind;
  $('wsModel').textContent = s.model || '';
  $('wsModel').style.display = s.model ? '' : 'none';
  $('attachBtn').textContent = s.attached ? 'LINKED ✓' : 'LINK FEISHU';
  const count = s.runningTasks || s.tasks?.length || 0;
  $('taskBadge').textContent = String(count);
  $('taskBadge').style.display = count ? '' : 'none';
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.tab));

  const panel = $('panel');
  const keyEnc = encodeURIComponent(s.key);
  try {
    if (state.tab === 'chat') {
      const [{ turns }, screenData] = await Promise.all([
        api(`/api/session/${keyEnc}/turns`),
        s.status === 'blocked' ? api(`/api/session/${keyEnc}/screen?lines=30`) : Promise.resolve(null),
      ]);
      const parts = [];
      if (screenData?.dialog) {
        const opts = screenData.dialog.options.map((o, i) =>
          `<button class="amber" data-key="${esc(o.key || String(i + 1))}">${esc(o.key ? `${o.key}. ` : '')}${esc(o.label)}</button>`).join('');
        parts.push(`<div class="hazard-banner"><strong style="font-family:var(--mono);color:var(--amber)">WARNING // CONFIRMATION REQUIRED</strong><div style="font-size:13px">${esc(screenData.dialog.question || '')}</div><div class="keybar">${opts}<button data-key="esc">ESC</button></div></div>`);
      }
      if (s.runningTasks > 0) {
        parts.push(`<div class="bg-strip"><span>ASYNC OPS ACTIVE // ${s.runningTasks} 个后台任务正在运行</span><button id="jumpTasksBtn">INSPECT LOGS →</button></div>`);
      }
      if (!turns.length) {
        parts.push(`<div class="empty">${s.kind === 'shell' ? '// SHELL UNIT — SWITCH TO TTY TAB' : '// NO TRANSCRIPT RECORDS YET'}</div>`);
      } else {
        for (const t of turns) {
          if (t.prompt) parts.push(`<div class="msg-user">${esc(t.prompt)}</div>`);
          if (t.texts?.length) parts.push(`<div class="msg-bot">${esc(t.texts.join('\n\n'))}</div>`);
        }
      }
      panel.innerHTML = parts.join('');
      panel.querySelectorAll('.hazard-banner button').forEach((btn) => { btn.onclick = () => sendKeys([btn.dataset.key]); });
      const jump = $('jumpTasksBtn');
      if (jump) jump.onclick = () => { state.tab = 'tasks'; renderWorkspace(); };
      panel.scrollTop = panel.scrollHeight;
    } else if (state.tab === 'tasks') {
      const q = state.selectedTaskId ? `&taskId=${encodeURIComponent(state.selectedTaskId)}` : '';
      const data = await api(`/api/session/${keyEnc}/tasks?lines=100${q}`);
      state.selectedTaskId = data.selectedTaskId;
      if (!data.tasks.length) {
        panel.innerHTML = '<div class="empty">// NO ASYNC BACKGROUND TASKS RECORDED FOR THIS UNIT</div>';
        return;
      }
      const tiles = data.tasks.map((t) => {
        const sel = t.id === data.selectedTaskId ? ' selected' : '';
        const dur = Math.max(0, Math.round(((t.endedAt || Date.now()) - t.startedAt) / 1000));
        return `<div class="task-tile ${esc(t.status)}${sel}" data-tid="${esc(t.id)}">
          <div class="task-head">
            <span>${esc(t.shortId)} // ${esc(t.kind.toUpperCase())}</span>
            <span class="tag ${t.status === 'running' ? 'background' : ''}">${esc(t.status)} · ${dur}s</span>
          </div>
          <div class="task-desc">${esc(t.description)}${t.summary ? ` — ${esc(t.summary)}` : ''}</div>
        </div>`;
      }).join('');
      const logBox = data.selectedTaskId
        ? `<div style="font-family:var(--mono);font-size:11px;color:var(--cyan)">LIVE STREAM // ${esc(data.selectedTaskId)}</div><pre class="terminal-box">${esc(data.log || '(no output yet)')}</pre>`
        : '';
      panel.innerHTML = `<div class="task-grid">${tiles}</div>${logBox}`;
      panel.querySelectorAll('.task-tile').forEach((el) => {
        el.onclick = () => { state.selectedTaskId = el.dataset.tid; renderWorkspace(); };
      });
    } else {
      const data = await api(`/api/session/${keyEnc}/screen?lines=100`);
      const keys = ['enter', 'esc', 'up', 'down', 'tab', 'c-c', '1', '2', '3', 'y', 'n'];
      panel.innerHTML = `
        <pre class="terminal-box">${esc(data.screen || '(empty screen)')}</pre>
        <div class="keybar">${keys.map((k) => `<button data-k="${k}">${k.toUpperCase()}</button>`).join('')}<button id="refreshTerm">SYNC</button></div>`;
      panel.querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => sendKeys([b.dataset.k]); });
      $('refreshTerm').onclick = () => renderWorkspace();
    }
  } catch (err) {
    panel.innerHTML = `<div class="empty">// TELEMETRY ERROR: ${esc(err.message)}</div>`;
  }
}

async function sendKeys(keys) {
  const s = selectedSession();
  if (!s) return;
  await api(`/api/session/${encodeURIComponent(s.key)}/keys`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keys }),
  });
  setTimeout(renderWorkspace, 350);
}

document.querySelectorAll('.tab').forEach((b) => { b.onclick = () => { state.tab = b.dataset.tab; renderWorkspace(); }; });
$('attachBtn').onclick = async () => { const s = selectedSession(); if (s) await api(`/api/session/${encodeURIComponent(s.key)}/attach`, { method: 'POST' }); };
$('detachBtn').onclick = async () => { await api('/api/detach', { method: 'POST' }); };
$('escBtn').onclick = () => sendKeys(['esc']);
$('killBtn').onclick = async () => {
  const s = selectedSession();
  if (!s || !confirm(`确认终止 tmux 会话 ${s.name}？`)) return;
  await api(`/api/session/${encodeURIComponent(s.key)}/kill`, { method: 'POST' });
};
$('logoutBtn').onclick = async () => {
  await fetch('/auth/logout', { method: 'POST' });
  location.reload();
};

$('composer').onsubmit = async (e) => {
  e.preventDefault();
  const s = selectedSession();
  const text = $('input').value.trim();
  if (!s || !text) return;
  $('input').value = '';
  try {
    const res = await api(`/api/session/${encodeURIComponent(s.key)}/send`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }),
    });
    if (res.blocked) alert('目标会话正在等待确认，请先响应对话框或切换至 TTY 按键。');
    setTimeout(renderWorkspace, 400);
  } catch (err) { alert(err.message); }
};
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
});

$('newBtn').onclick = async () => {
  $('fAgent').innerHTML = (state.agents.length ? state.agents : ['agy', 'claude', 'codex', 'pi', 'shell'])
    .map((a) => `<option value="${esc(a)}">${esc(a.toUpperCase())}</option>`).join('');
  try {
    const { conversations } = await api('/api/history');
    $('fResume').innerHTML = '<option value="new">NEW SESSION // 新对话</option><option value="last">CONTINUE LAST // 继续目录最近一次对话</option>'
      + conversations.map((c) => `<option value="${esc(c.agent)}:${esc(c.id)}">${esc(c.agent.toUpperCase())} · ${esc(c.title.slice(0, 36))}</option>`).join('');
  } catch {}
  $('newDialog').showModal();
};
$('cancelNew').onclick = () => $('newDialog').close();
$('newForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const created = await api('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        resume: $('fResume').value,
        agent: $('fAgent').value,
        cwd: $('fCwd').value.trim() || '~',
        name: $('fName').value.trim(),
        prompt: $('fPrompt').value.trim(),
      }),
    });
    state.selectedKey = created.key;
    setMode('sessions');
    $('newDialog').close();
    renderWorkspace();
  } catch (err) { alert(err.message); }
};

function connectSSE() {
  const es = new EventSource('/api/events');
  es.onopen = () => $('sseDot').classList.add('ok');
  es.onerror = () => $('sseDot').classList.remove('ok');
  es.addEventListener('state', (e) => {
    const data = JSON.parse(e.data);
    state.sessions = data.sessions || [];
    state.status = data.status || null;
    state.agents = data.agents || [];
    if (data.user) state.user = data.user;
    if (data.authMode) state.authMode = data.authMode;
    if (data.agentboard) state.agentboard = data.agentboard;
    renderSessions();
    renderWorkspace();
  });
}

setInterval(() => {
  if (state.mode !== 'sessions') return;
  const s = selectedSession();
  if (!s) return;
  if (state.tab === 'term' || (state.tab === 'tasks' && s.runningTasks > 0)) renderWorkspace();
}, 2500);

connectSSE();
</script>
</body>
</html>
