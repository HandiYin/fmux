<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-maskable-512.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="agentboard"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4f46e5">
<title>agentboard</title>
<style>
:root{
  --h1:#9be9a8; --h2:#40c463; --h3:#30a14e; --h4:#216e39; --bg:#f6f7f9; --panel:#fff; --panel2:#f1f3f6; --line:#e3e6eb; --text:#1b1f24; --muted:#6b7280; --faint:#9aa1ab;
  --accent:#4f46e5; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --s-todo:#94a3b8; --s-triage:#8b5cf6; --s-queued:#6366f1; --s-running:#2563eb; --s-review:#d97706;
  --s-needs:#e11d48; --s-failed:#dc2626; --s-done:#16a34a; --s-stopped:#78716c; --s-doing:#0891b2;
  --claude:#c96442; --codex:#0e9f6e; --q1:#dc2626; --urgent:#ea580c; --important:#ca8a04;
  --body-txt:#374151; --strong-txt:#0f172a; --h-txt:#312e81; --code-txt:#0f766e; --path-txt:#b45309; --link-txt:#2563eb;
  --hk-res-fg:#15803d; --hk-prob-fg:#b91c1c; --hk-act-fg:#b45309; --hk-fact-fg:#1d4ed8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353; --bg:#0f1115; --panel:#171a20; --panel2:#1e222a; --line:#2a2f38; --text:#e6e8eb; --muted:#9aa3ae; --faint:#6b7480;
  --accent:#818cf8; --shadow:0 1px 2px rgba(0,0,0,.4);
  --s-todo:#64748b; --s-review:#f59e0b; --s-needs:#fb7185; --s-running:#60a5fa; --s-done:#22c55e;
  --claude:#e08a68; --codex:#34d399; --q1:#f87171; --urgent:#fb923c; --important:#facc15;
  --body-txt:#b5becb; --strong-txt:#f8fafc; --h-txt:#a5b4fc; --code-txt:#7dd3fc; --path-txt:#f0b86e; --link-txt:#60a5fa;
  --hk-res-fg:#86efac; --hk-prob-fg:#fca5a5; --hk-act-fg:#fcd34d; --hk-fact-fg:#93c5fd;
}}
:root[data-theme=dark]{
  --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353; --bg:#0f1115; --panel:#171a20; --panel2:#1e222a; --line:#2a2f38; --text:#e6e8eb; --muted:#9aa3ae; --faint:#6b7480;
  --accent:#818cf8; --shadow:0 1px 2px rgba(0,0,0,.4);
  --s-todo:#64748b; --s-review:#f59e0b; --s-needs:#fb7185; --s-running:#60a5fa; --s-done:#22c55e;
  --claude:#e08a68; --codex:#34d399; --q1:#f87171; --urgent:#fb923c; --important:#facc15;
  --body-txt:#b5becb; --strong-txt:#f8fafc; --h-txt:#a5b4fc; --code-txt:#7dd3fc; --path-txt:#f0b86e; --link-txt:#60a5fa;
  --hk-res-fg:#86efac; --hk-prob-fg:#fca5a5; --hk-act-fg:#fcd34d; --hk-fact-fg:#93c5fd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans CJK SC",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.warn{color:var(--s-failed)}
.app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap;position:relative}
header>*{flex:none}
header .chips{flex:0 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
header #search{flex:0 1 200px;min-width:90px}
header #usage{flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
header #usage::-webkit-scrollbar{display:none}
header #usage>*{flex:none}
header .spacer{flex:1 1 0;min-width:0}
#moreMenu{position:absolute;right:10px;top:100%;z-index:40;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow),0 8px 24px rgba(0,0,0,.18)}
@media (max-width:1700px){#usage .bar{display:none !important}}
@media (max-width:1450px){#apSwitch b{display:none}}
#moreMenu[hidden]{display:none}
#moreMenu .btn{justify-content:flex-start;text-align:left;white-space:nowrap}
header #filters{flex:1 1 0;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
header #filters::-webkit-scrollbar{display:none}
header #filters>*{flex:none}
.logo{font-weight:700;letter-spacing:-.02em;font-size:15px;display:flex;align-items:center;gap:6px}
.logo i{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--claude),var(--codex));display:inline-block}
.tabs{display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.tabs button{border:0;background:transparent;padding:4px 12px;border-radius:6px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.tabs .badge{margin-left:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{white-space:nowrap;flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;color:var(--muted);font-size:12px}
.chip.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--text)}
.spacer{flex:1}
#search{width:200px}
.switch{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:var(--muted)}
.switch input{display:none}
.switch span{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;transition:.15s}
.switch span:after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--s-done)}
.switch input:checked+span:after{left:15px}
.switch.on b{color:var(--s-done)}
.badge{display:inline-flex;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--s-needs);color:#fff;font-size:11px;align-items:center;justify-content:center;font-weight:600}
.badge.zero{background:var(--line);color:var(--muted)}

/* waiting-on-you strip */
#strip{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 60%,var(--bg));min-height:46px;align-items:center}
#strip .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;font-weight:600}
.wcard{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--s-needs));border-radius:8px;padding:4px 6px 4px 8px;white-space:nowrap;box-shadow:var(--shadow);cursor:pointer;max-width:340px}
.wcard .t{overflow:hidden;text-overflow:ellipsis;max-width:220px}
.wcard .why{font-size:11px;color:var(--c);font-weight:600}
.wcard.fresh{animation:pop .6s ease 2}
@keyframes pop{50%{transform:translateY(-2px);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}}
.empty-strip{color:var(--faint);font-size:12px}

main{flex:1;display:flex;min-height:0}
#board{flex:1;display:flex;gap:12px;padding:12px 14px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 300px;background:var(--panel2);border-radius:10px;display:flex;flex-direction:column;max-height:100%;border-top:3px solid var(--cc)}
.col.collapsed{flex-basis:42px}
.col.collapsed .colbody,.col.collapsed .qa,.col.collapsed .colhead .ctl{display:none}
.col.collapsed .colhead{writing-mode:vertical-rl;padding:10px 8px;cursor:pointer}
.col.collapsed:hover{border-color:var(--cc)}
.col.dragover{outline:2px dashed var(--cc);outline-offset:-2px}
.colhead{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;font-weight:600;cursor:grab}
.colhead .dot{width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}
.colhead .cnt{color:var(--muted);font-weight:500;font-size:12px}
.colhead .cnt.over{color:var(--s-failed)}
.colhead .ctl{margin-left:auto;display:flex;gap:2px}
.colhead .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qa{padding:4px 8px}
.qa{display:flex;gap:4px;align-items:center}
.qa input{flex:1;min-width:0;background:var(--panel);border-style:dashed}
.toen{font-size:11px;padding:2px 6px;flex:none}
.colbody{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.drop-hint{height:3px;border-radius:2px;background:var(--accent);margin:-2px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px 7px 11px;box-shadow:var(--shadow);cursor:pointer;position:relative;border-left:3px solid var(--sc)}
.card:hover{border-color:color-mix(in srgb,var(--sc) 50%,var(--line))}
.card.dragging{opacity:.4}
.card.q1{background:color-mix(in srgb,var(--q1) 7%,var(--panel))}
.card.human{background:color-mix(in srgb,var(--s-doing) 5%,var(--panel))}
.card.done{opacity:.6}
.card .row1{display:flex;gap:6px;align-items:flex-start}
.card .title{flex:1;font-weight:500;word-break:break-word}
.card .flags{display:flex;gap:2px;flex:none}
.flag{border:0;background:transparent;padding:0 2px;font-size:13px;opacity:.22;filter:grayscale(1)}
.flag.on{opacity:1;filter:none}
.card:hover .flag{opacity:.55}
.card:hover .flag.on{opacity:1}
.row2{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:5px}
.pill{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);background:transparent;line-height:16px}
button.pill:hover{border-color:var(--muted)}
.pill.st{color:#fff;border-color:transparent;background:var(--sc);font-weight:600}
.pill.agent-claude{color:var(--claude);border-color:color-mix(in srgb,var(--claude) 45%,transparent)}
.pill.agent-codex{color:var(--codex);border-color:color-mix(in srgb,var(--codex) 45%,transparent)}
.pill.agent-antigravity{color:#a855f7;border-color:color-mix(in srgb,#a855f7 45%,transparent)}
.pill.agent-deepseek{color:#4d6bfe;border-color:color-mix(in srgb,#4d6bfe 45%,transparent)}
.pill.me{color:var(--s-doing);border-color:color-mix(in srgb,var(--s-doing) 45%,transparent)}
.pill.due{color:var(--muted)}
.pill.due.today{color:var(--urgent);border-color:var(--urgent)}
.pill.due.over{color:#fff;background:var(--s-failed);border-color:var(--s-failed)}
.pill.auto{border-style:dashed}
.prog{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--s-done)}
.card .act{margin-left:auto}
.q{margin-top:5px;font-size:12px;color:var(--s-needs);background:color-mix(in srgb,var(--s-needs) 8%,transparent);border-radius:5px;padding:3px 6px}
.spin{display:inline-block;width:9px;height:9px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.running-glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--s-running) 25%,transparent)}}
.donebox{margin-top:4px}
.donebox summary{color:var(--muted);font-size:12px;cursor:pointer;padding:2px}
.addcol{flex:0 0 160px;border:2px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);text-align:center;cursor:pointer;background:transparent}

/* live rail */
#rail{width:270px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px}
#rail.hide{display:none}
#rail h4,.sec h4{margin:4px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.lrow{display:flex;gap:7px;align-items:center;padding:6px 7px;border-radius:7px;cursor:grab;border:1px solid transparent}
.lrow:hover{background:var(--panel2);border-color:var(--line)}
.lrow.dropto{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ho{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-style:dashed}
.ho.set{border-style:solid;border-color:var(--accent);color:var(--accent)}
.hopick{display:flex;flex-wrap:wrap;gap:6px}
.hopick button{display:flex;gap:6px;align-items:center;max-width:100%;text-align:left;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;font-size:12px}
.hopick button:hover{border-color:var(--accent)}
.hopick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.hopick .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.hopick .why{color:var(--faint);font-size:11px}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sub{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--s-todo)}
.sdot.busy{background:var(--s-running);animation:glow 1.4s infinite}
.sdot.idle,.sdot.shell{background:var(--s-done)}
.sdot.permission{background:var(--s-needs);animation:glow 1s infinite}
.sdot.att{box-shadow:0 0 0 3px color-mix(in srgb,var(--s-review) 40%,transparent)}
.ag{font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;flex:none}
.ag.claude{color:var(--claude);background:color-mix(in srgb,var(--claude) 14%,transparent)}
.ag.codex{color:var(--codex);background:color-mix(in srgb,var(--codex) 14%,transparent)}
.ag.antigravity{color:#a855f7;background:color-mix(in srgb,#a855f7 14%,transparent)}
.ag.deepseek{color:#4d6bfe;background:color-mix(in srgb,#4d6bfe 14%,transparent)}

/* sessions view */
#sessions{flex:1;overflow-y:auto;padding:14px;display:none}
#progress{flex:1;overflow-y:auto;padding:16px;display:none}
.pwrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pstats{display:flex;flex-wrap:wrap;gap:8px}
.pstat{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.pstat b{display:block;font-size:22px;line-height:1.2}
.pstat span{font-size:12px;color:var(--muted)}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.phead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.phead h3{margin:0;font-size:13px;flex:1;min-width:150px}
.hmscroll{overflow-x:auto;padding:2px}
.hmgrid{display:grid;grid-template-columns:30px repeat(var(--weeks),12px);grid-template-rows:15px repeat(7,12px);gap:3px;width:max-content;font-size:10px;color:var(--muted)}
.hmgrid>span{white-space:nowrap;line-height:12px}
.hm{width:12px;height:12px;padding:0;border:0;border-radius:2px;background:color-mix(in srgb,var(--text) 8%,transparent);cursor:pointer}
.hm.l1{background:var(--h1)}.hm.l2{background:var(--h2)}.hm.l3{background:var(--h3)}.hm.l4{background:var(--h4)}
.hm.sel,.hm:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.hmlegend{display:flex;justify-content:flex-end;align-items:center;gap:3px;margin-top:8px;font-size:11px;color:var(--muted)}
.hmlegend .hm{cursor:default;margin:0 1px}
#hmTip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--panel);font-size:12px;border-radius:6px;padding:4px 8px;max-width:300px}
.pgroup{padding:10px 0;border-top:1px solid var(--line)}
.pgroup:first-of-type{border-top:0}
.pgroup h4{margin:0 0 5px;font-size:13px}
.pgroup h4 span{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.prow{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px}
.prow button{all:unset;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow button:hover{text-decoration:underline}.prow button:focus-visible{outline:2px solid var(--accent)}
.prow small{color:var(--muted);white-space:nowrap}
.sec{margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:9px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tile.att{box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 50%,transparent)}
.tile .th{display:flex;gap:7px;align-items:center;padding:8px 10px 4px}
.tile .th .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .meta{font-size:11px;color:var(--faint);padding:0 10px}
.screen{font-family:var(--mono);font-size:11px;line-height:1.35;background:var(--panel2);margin:6px 10px;border-radius:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:hidden;color:var(--muted);mask-image:linear-gradient(to bottom,transparent,#000 22%)}
.screen.full{max-height:none;mask-image:none;overflow:auto;max-height:60vh;color:var(--text)}
.tile .reply{display:flex;gap:4px;padding:0 10px 8px}
.tile .reply input{flex:1;min-width:0}
.tile .acts{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 10px}
.hist{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.hrow{display:grid;grid-template-columns:52px minmax(0,2.2fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.hrow:last-child{border:0}
.hrow:hover{background:var(--panel2)}
.hrow .tt{min-width:0}
.hrow .tt b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tt small{color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .cwd,.hrow .when{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .when{overflow:visible;text-align:right;min-width:92px}
.hrow .when .cost{color:var(--text);font-weight:600}
.hrow .ha{display:flex;gap:3px;opacity:.35}
.hrow:hover .ha{opacity:1}
.livetag{font-size:10px;color:var(--s-done);font-weight:700}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--dw,560px),100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column;z-index:20}
#drawer.open{transform:none}
#dGrip{position:fixed;top:0;bottom:0;right:min(var(--dw,560px),100vw);width:8px;margin-right:-4px;cursor:col-resize;z-index:21;display:none}
#drawer.open + #dGrip{display:block}
#dGrip:hover,#dGrip.on{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.dfull #dGrip{width:14px;margin-right:-14px}
body.resizing{user-select:none;cursor:col-resize}
body.resizing #drawer{transition:none}
.dh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;border-top:4px solid var(--cc,var(--line))}
.dh textarea{flex:1;font-size:16px;font-weight:600;border:0;resize:none;background:transparent;padding:2px}
.db{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;gap:10px;align-items:center}
.field>label{width:84px;color:var(--muted);font-size:12px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}

.chat[data-cv=screen] #chatNote,.chat[data-cv=screen] .chatbar{display:none}
.term .cur{background:#d6dde6!important;color:#0d1117!important}
.term.live:not(.typing) .cur{background:transparent!important;color:inherit!important;outline:1px solid #8b949e}

[hidden]{display:none!important}
.spanel .pcol{display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px 14px;gap:6px}
#pKeys{display:inline-flex;gap:2px}
.spanel .pcol+.pcol{border-left:1px solid var(--line)}
.spanel .pcol h5{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px;align-items:center}
.spanel .term{flex:1;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.4;background:#0d1117;color:#d6dde6;border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin:0}
.spanel .msgs{flex:1}
.spanel .pf{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px}

@media (max-width:900px){.spanel .pb{grid-template-columns:1fr}.spanel .pcol+.pcol{border-left:0;border-top:1px solid var(--line)}.spanel{height:auto}.spanel .term,.spanel .msgs{max-height:45vh;min-height:200px}}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:8px 4px 14px;min-height:200px}
.msg{flex:none;max-width:88%;min-width:0;overflow-x:auto;padding:8px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-word;line-height:1.55}

.atts .att.file{width:auto;height:auto;max-width:260px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 16px 4px 8px;font-size:12px}

.filedrag .chatbar,.filedrag .pf .row{outline:2px dashed var(--accent);outline-offset:2px}
.msg.user{align-self:flex-end;max-width:82%;font-size:13.5px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.mfoot{display:flex;align-items:center;gap:10px;margin-top:8px}
.copybtn,.trcopy,.codecopy{display:inline-flex;align-items:center;padding:0;border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer}

.copybtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg.assistant{align-self:stretch;max-width:100%;font-size:14px;line-height:1.72;padding:13px 16px;color:var(--body-txt);background:color-mix(in srgb,var(--panel2) 55%,var(--panel));border:1px solid color-mix(in srgb,var(--line) 65%,transparent);border-left:3px solid color-mix(in srgb,var(--cc,var(--accent)) 42%,var(--line));border-radius:8px}

.msg code{font-family:var(--mono);font-size:.88em;color:var(--code-txt);background:color-mix(in srgb,var(--code-txt) 11%,transparent);padding:1px 5px;border-radius:4px}
.msg .fpath{font-family:var(--mono);font-size:.88em;color:var(--path-txt);background:color-mix(in srgb,var(--path-txt) 11%,transparent);padding:1px 5px;border-radius:4px}

.codebox{margin:.6em 0 .9em;border-radius:8px;overflow:hidden;border:1px solid color-mix(in srgb,var(--line) 80%,#1e2430);background:#0d1117}
.codebar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:#161b22;border-bottom:1px solid #262c36;font-family:var(--mono);font-size:11px;color:#8b949e}

.msg pre.code{font-family:var(--mono);font-size:12px;line-height:1.52;background:#0d1117;color:#d6dde6;padding:10px 12px;overflow-x:auto;white-space:pre;margin:0}
.codebox.fold pre.code{max-height:300px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent);mask-image:linear-gradient(to bottom,#000 72%,transparent)}
.code-more{display:block;width:100%;padding:5px 10px;border:0;border-top:1px solid #262c36;background:#161b22;color:#8b949e;font-size:11.5px;text-align:center}
.code-more:hover{color:#fff;background:#1f2630}
.msg b.h{display:block;margin-top:6px;color:var(--h-txt)}
.msg.assistant .p>b:only-child,.msg.assistant .li>div>b:first-child{color:var(--h-txt)}
.msg .p{margin:0 0 .82em}
.msg .p:last-child,.msg .li:last-child{margin-bottom:0}
.msg .h{font-weight:680;margin:1.35em 0 .48em;line-height:1.35;letter-spacing:-.01em;cursor:pointer;display:flex;align-items:baseline;gap:5px;user-select:none;color:var(--h-txt)}
.msg .h::before{content:"▾";font-size:.78em;color:var(--faint);flex:none;width:1em;text-align:center;transition:transform .12s}
.msg .h:hover::before{color:var(--text)}
.msg .h.sec-fold::before{content:"▸";color:var(--accent)}
.msg .h.sec-fold{color:var(--muted)}
.msg .h1{font-size:1.22em;padding-bottom:.28em;border-bottom:1px solid var(--line)}
.msg .h2{font-size:1.11em;padding-bottom:.22em;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.msg .h3{font-size:1.02em}
.msg .mbody>.h:first-child,.msg .trans>.h:first-child,.msg .toc+.h{margin-top:.15em}
.msg .sec-hid{display:none!important}

@keyframes tochit{0%{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px}100%{background:transparent}}
.toc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 .85em;padding:6px 8px;border-radius:7px;background:color-mix(in srgb,var(--text) 3.5%,transparent);border:1px solid color-mix(in srgb,var(--line) 75%,transparent)}

.msg .bq{margin:.55em 0 .85em;padding:7px 12px;border-left:3px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:0 6px 6px 0;color:var(--muted)}

.msg .li>div{min-width:0;flex:1}

.msg>:last-child{margin-bottom:0}
.tblwrap{overflow-x:auto;margin:.6em 0 .9em;border:1px solid var(--line);border-radius:7px;background:linear-gradient(to right,var(--panel2) 30%,transparent) 0 0/32px 100% no-repeat local,linear-gradient(to left,var(--panel2) 30%,transparent) 100% 0/32px 100% no-repeat local,linear-gradient(to right,color-mix(in srgb,var(--text) 18%,transparent),transparent) 0 0/10px 100% no-repeat scroll,linear-gradient(to left,color-mix(in srgb,var(--text) 18%,transparent),transparent) 100% 0/10px 100% no-repeat scroll}
.msg table{border-collapse:collapse;font-size:12.5px;width:100%;min-width:max-content;white-space:normal}
.cell{max-width:28em;word-break:normal;overflow-wrap:break-word}
.pastconv{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:0 0 6px;font-size:11.5px;color:var(--muted)}

.csug{margin-top:6px;padding:5px 7px;display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:7px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.csug>div:first-child{min-width:0;flex:1 1 120px;overflow-wrap:anywhere}

body:not(.tr-off) .msg.has-tr:not(.show-orig) > .mbody,.msg.has-tr.tr-manual:not(.show-orig) > .mbody{display:none}

.trbtn{display:none!important}

{ const setW = w => { document.documentElement.style.setProperty("--dw", Math.round(w) + "px"); document.documentElement.classList.toggle("dfull", w >= window.innerWidth - 2) };

function cardHTML(t){
  const [sl, sv] = STATUS[t.status] || [t.status, "--s-todo"];

    act = t.status === "done" ? `<button class="btn sm" data-a="reopen">↺</button>` : t.status === "doing" ? `<button class="btn sm" data-a="done">✓ Done</button>` : `<button class="btn sm" data-a="doing">Start</button>`;
  } else switch (t.status){

    case "queued": act = `<span class="small">${t.handoff ? (t.handoff.wait === "slot" ? `waits for a free run slot (${S.running}/${S.settings.max_parallel})` : t.handoff.wait ? "waits · session " + esc(t.handoff.wait) : "handing over…") : (S.slots ?? S.running) >= S.settings.max_parallel ? `waits for a free slot (${S.slots ?? S.running}/${S.settings.max_parallel}) <button class="btn ghost sm" data-a="morepar" title="Allow one more agent at a time">+1</button>` : "starting…"}</span>`; break;
    case "running": act = `<button class="btn sm ghost" data-a="stop" title="Stop">■</button>`; break;
    case "review": act = t.merge_error ? `<button class="btn sm" data-a="redo" title="Merge conflict: redo the change on the latest code">⚠ Redo</button>` : `<button class="btn sm pri" data-a="approve" title="Approve (merge worktree branch)">✓ Approve</button>`; break;
    case "needs_me": act = `<button class="btn sm" data-a="chat">Answer</button>`; break;

  return `<div class="card ${q1?"q1":""} ${human?"human":""} ${t.status==="done"?"done":""} ${t.status==="running" && !idleBg?"running-glow":""}" draggable="true" data-id="${t.id}" style="--sc:var(${human && t.status==="todo" ? "--s-doing" : sv})">
    <div class="row1">
      <div class="title">${q1?"🔥 ":""}${esc(t.title)}</div>
      <div class="flags"><button class="flag ${t.urgent?"on":""}" data-a="urgent" title="Urgent">⏰</button><button class="flag ${t.important?"on":""}" data-a="important" title="Important">★</button></div>
    </div>
    <div class="row2">
      ${lv && !["running","review","needs_me"].includes(t.status) ? `<span class="pill st" style="--sc:var(${lv.status==="busy"?"--s-running":lv.status==="permission"?"--s-needs":"--s-done"})">${lv.status==="busy"?'<span class="spin"></span> live':lv.status==="permission"?"live · permission":"live · idle"}</span>` : (idleBg ? `<span class="pill st" style="--sc:var(--s-review)" title="${esc(t.run_info.bg ? "Still running: " + t.run_info.bg : "A background command is still running")}">Answered · job running</span>` : `<span class="pill st" style="--sc:var(${sv})">${t.triaging ? '<span class="spin"></span> triage' : sl}</span>`)}
      <button class="pill ${human?"me":""}" data-a="owner" title="Who does it? click to toggle">${human ? "🙋 me" : "🤖"}</button>
      ${human || t.handoff ? "" : `<button class="pill agent-${eff.agent} ${t.agent==="auto"?"auto":""}" data-a="agent" title="Agent (${t.agent}); click to cycle">${agName(eff.agent)}</button>
      <button class="pill ${t.tier==="auto"?"auto":""}" data-a="tier" title="${esc(eff.model+" · "+eff.effort+(t.triage?" — "+(t.triage.reason||""):""))}; ${eff.custom ? "picked on the card, click to change" : "click to cycle the size"}">${eff.custom ? "✎ " + esc(eff.model) + " · " + esc(eff.effort) : eff.tier + " · " + esc(eff.model)}</button>`}

      ${due}${running}${!human && t.access === "full" ? `<span class="pill" title="Full access: no limits" style="color:var(--s-failed)">🔓 full</span>` : !human && t.access === "read" ? `<span class="pill" title="Read only">👁 read</span>` : ""}
      ${!human && eff.run_mode === "terminal" && !t.handoff ? `<span class="pill" title="Runs in a tmux window you can watch and type into">⌨ terminal</span>` : ""}
      ${human || !t.handoff ? "" : `<button class="pill ho ${t.handoff.auto ? "" : "set"}" data-a="pick" title="${esc((t.handoff.auto ? "Auto-picked: " + (t.handoff.why || "related work") : "You picked this session") + ". Click to change.")}">↪ ${esc(t.handoff.title || "session")}</button>`}
      ${t.session && !lv ? `<button class="pill" data-a="chat" title="Open the conversation">💬</button>` : ""}
      <span class="act">${act}</span>
    </div>
    ${t.status === "needs_me" && t.question ? `<div class="q">? ${esc(t.question)}</div>` : ""}
    ${sugHTML(t, "data-a")}
    ${t.tldr && t.tldr_run === lastRun?.id && (t.status === "review" || (t.status === "needs_me" && !t.question)) ? `<div class="ctldr" title="${esc(t.tldr.replace(/^- /gm, ""))}">${esc(t.tldr.replace(/^- /gm, ""))}</div>` : ""}
    ${t.review ? `<div class="small" style="margin-top:4px">${t.review.verdict==="PASS"?"✅":"⚠️"} ${esc(t.review.by)} review: ${t.review.verdict}</div>` : ""}
    ${tot ? `<div class="prog" title="${done}/${tot}"><i style="width:${100*done/tot}%"></i></div>` : ""}
  </div>`;
}
function fmtDue(d){
  const t = todayISO(); if (d === t) return "today";
  const dd = new Date(d+"T00:00"), td = new Date(t+"T00:00"); const diff = Math.round((dd-td)/86400000);
  if (diff === 1) return "tomorrow"; if (diff === -1) return "yesterday";
  if (diff > 1 && diff < 7) return dd.toLocaleDateString(undefined,{weekday:"short"});
  return dd.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

async function cardAction(t, a){

  else if (a === "owner") await api(`/api/task/${t.id}`, {owner: t.owner === "me" ? "agent" : "me", status: t.status === "doing" ? "todo" : t.status});
  else if (a === "agent") await api(`/api/task/${t.id}`, {agent: AGENTS[(AGENTS.indexOf(t.agent)+1) % AGENTS.length]});
  else if (a === "tier"){ if (t.eff && t.eff.custom) return openDrawer(t.id, "detail"); await api(`/api/task/${t.id}`, {tier: TIERS[(TIERS.indexOf(t.tier)+1) % 5]}) }
  else if (a === "open") return openDrawer(t.id);
  else if (a === "chat") return openDrawer(t.id, "chat");
  else if (a === "pick"){ openDrawer(t.id, "detail"); return }
  else if (a === "morepar") await api("/api/settings", {max_parallel:Math.min(8, S.settings.max_parallel + 1)});
  else await taskAction(t.id, a);
  refresh();
}

// jump to the next item waiting on you (sessions open as panels, tasks as drawers)
function openNext(){
  const items = attnItems().filter(i => !(panel && i.key === panel.key) && !(openTask && i.t && i.t.id === openTask));
  const i = items[0];
  if (!i){ toast({title:"Inbox zero 🎉", body:"Nothing else is waiting on you.", c:"var(--s-done)"}); return }
  if (i.kind === "session" && i.s){ closeDrawer(); openPanel(i.s) }
  else if (i.t){ openDrawer(i.t.id, i.t.session ? "chat" : undefined) }
}

function closePanel(){ panel = null; $("#sessFocus").innerHTML = ""; renderSessions(true) }
async function updatePanel(first){
  syncAtts(); restoreDraft($("#pIn"));
  if (!panel || !$("#sessFocus").firstChild) return;
  const live = S.live.find(x => x.key === panel.key);
  const nx = $("#pNext"); if (nx){ const n = attnItems().filter(i => i.key !== panel.key).length; nx.textContent = n ? `Next ⏭ ${n}` : "Next ⏭"; nx.classList.toggle("pri", n > 0) }
  const st = $("#pStatus"); if (st) st.innerHTML = live ? (live.status === "permission" ? "<b style='color:var(--s-needs)'>needs permission</b>" : live.status === "busy" ? "<span class='spin' style='color:var(--s-running)'></span> working" : "idle") : "not running";
  const note = $("#pNote"), inp = $("#pIn"), send = $("#pSend");
  let mode = "none";
  if (live && live.pane){ mode = "pane"; note.textContent = "Live session. Your message is typed into its terminal." }
  else if (live && live.bg){ note.textContent = "Running in the background with no terminal. Read-only here." }
  else if (panel.id){ mode = "board"; note.textContent = "Not running. Sending puts it on the board (Inbox) and continues the conversation in the background." }
  else note.textContent = "";
  inp.disabled = send.disabled = mode === "none"; panel.mode = mode;
  if (live && live.status === "permission") note.innerHTML = `<b style="color:var(--s-needs)">✋ Waiting for your permission:</b> answer with the buttons on the right${$(".spanel .pb")?.dataset.v === "chat" ? ` · <a href="#" data-pv="term" onclick="return false">show the screen</a>` : ""}`;
  const busy = mode === "pane" && live.status === "busy"; $("#pNow").hidden = !busy; send.textContent = "Send";
  if (busy) note.textContent = "Agent is working. Send types your message in; it picks it up while it works. ⚡ Interrupt & send presses Esc first.";
  const keys = $("#pKeys"); if (keys) keys.innerHTML = live && live.pane ? ["1","2","3","Escape","Enter"].map(k => `<button class="btn sm ghost" data-pk="${k}">${k === "Escape" ? "Esc" : k === "Enter" ? "⏎" : k}</button>`).join("") : "";
  const term = $("#pTerm");
  if (term && live && live.pane){
    const txt = renderTerm(term, await api("/api/pane/" + encodeURIComponent(live.pane) + "?ansi=1&n=" + TERM_N), first, live.pane).replace(/\s+$/, "");
    // unsent text in the agent's input box would get our message appended to it
    const tail = txt.split("\n").slice(-8), sep = tail.map(l => /^[─━]{10,}/.test(l));
    const box = tail.findIndex((l, k) => sep[k - 1] && /^[❯›>] \S/.test(l) && !/Ask Codex to do anything/.test(l));
    if (box >= 0 && panel.mode === "pane") note.innerHTML = `<b style="color:var(--s-review)">⚠ The terminal's input box already has unsent text:</b> “${esc(tail[box].slice(2, 90))}”. Your message will be appended to it.`;
  }
  const pm = $("#pMsgs");
  if (pm && panel.id){ const c = Chat.of({kind:panel.kind, id:panel.id}); if (first) c.pos = null; if (c.el !== pm) c.attach(pm); else c.poll() }
}
setInterval(() => { if (view === "sessions" && panel) updatePanel(false) }, 2000);
async function panelSend(now){
  if (!panel) return;
  if (await previewEnglish($("#pIn"))) return;
  const text = await takeMessage($("#pIn")); if (!text && !(now && panel.mode === "pane")) return;
  const live = S.live.find(x => x.key === panel.key);
  if (panel.mode === "pane"){ $("#pIn").value = ""; if (text) appendPending($("#pMsgs"), text, panel.id ? {kind:panel.kind, id:panel.id} : null); await api("/api/session", {action:"send", key:live.key, pane:live.pane, text, interrupt:!!now}); setTimeout(() => updatePanel(false), 800) }
  else if (panel.mode === "board"){
    $("#pIn").value = "";
    const r = await api("/api/session", {action:"totask", key:panel.key, cat:S.categories[0].id, kind:panel.kind, id:panel.id, cwd:panel.cwd || "", title:panel.title});
    await api(`/api/task/${r.id}/action`, {action:"chat", text}); await refresh(); openDrawer(r.id, "chat");
    toast({title:"Continuing on the board", body: r.existing ? "Using the card that already tracks this session" : "Card added to " + S.categories[0].name});
  }
}
$("#sessFocus").addEventListener("click", async e => {

});
$("#sessFocus").addEventListener("keydown", e => { if (e.target.id === "pIn" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); panelSend((e.metaKey || e.ctrlKey) && !$("#pNow").hidden) } if (e.key === "Escape") e.target.blur() });

let histSeq = 0;
async function loadHistory(){ const my = ++histSeq, r = await api("/api/history?q=" + encodeURIComponent(histQ)); if (my !== histSeq) return;  // an older answer must not replace a newer search
  histCache = r; if (view === "sessions") keepFocus(() => renderSessions(true)) }
let histT = null;
document.addEventListener("input", e => { if (e.target.id !== "histQ") return; histQ = e.target.value; clearTimeout(histT); histT = setTimeout(loadHistory, 200) });
setInterval(() => { if (view === "sessions") loadHistory() }, 20000);
function renderSessions(force){
  if (!S) return;  // opened straight on this tab: history can arrive before the first board state
  const live = [...S.live].sort((a,b) => (!!b.attention - !!a.attention) || (b.pinned - a.pinned) || (a.status === "busy") - (b.status === "busy") || (b.updated - a.updated));
  const color = s => s.status === "permission" ? "var(--s-needs)" : s.status === "busy" ? "var(--s-running)" : "var(--s-done)";
  const tiles = live.map(s => `<div class="tile ${s.attention?"att":""} ${panel && panel.key===s.key?"sel":""}" draggable="true" title="Click to open full width" data-k="${esc(s.key)}" style="--tc:${color(s)}">
    <div class="th"><span class="sdot ${s.status}"></span><span class="ag ${s.kind}">${agName(s.kind)}</span>
      <span class="nm" title="double-click to rename">${s.pinned?"📌 ":""}${esc(s.label || s.name)}</span>
      <span class="small">${s.status==="shell"?"idle · shells running":s.status==="permission"?"<b style='color:var(--s-needs)'>needs permission</b>":s.status}${s.attention && s.attention.reason==="finished"?" · <b style='color:var(--s-done)'>finished "+ago(s.attention.since)+"</b>":""}</span></div>
    <div class="meta">${esc(s.where || "no tmux pane")} · ${esc(shortPath(s.cwd))}${s.bg?" · background":""}${s.task?" · 🗂 on board":""}</div>
    <div class="screen">${esc(s.screen_tail || "(no screen)")}</div>
    ${s.pane ? `<div class="reply"><input data-reply="${esc(s.key)}" placeholder="Reply to this session… (Enter)">${s.status==="permission"?`<button class="btn sm" data-key="1">1 Yes</button><button class="btn sm" data-key="2">2</button><button class="btn sm" data-key="Escape">Esc</button>`:""}</div>`:""}
    <div class="acts"><button class="btn sm pri" data-sa="open">⤢ Open</button>
      ${s.attention?`<button class="btn sm" data-sa="ack">✓ Seen</button>`:""}
      <button class="btn sm ghost" data-sa="pin">${s.pinned?"Unpin":"📌 Pin"}</button>
      <button class="btn sm ghost" data-sa="totask">→ Board</button><span class="spacer"></span><button class="btn sm ghost warn" data-sa="end" title="Quit this agent (the conversation is kept in History)">⏻ End</button></div>
  </div>`).join("");
  const hist = histCache.filter(h => histAgent === "all" || h.kind === histAgent);
  const rows = hist.slice(0, 200).map(h => `<div class="hrow" draggable="true" data-k="${esc(h.key)}">
    <span class="ag ${h.kind}">${agName(h.kind)}</span>
    <div class="tt"><b>${h.pinned?"📌 ":""}${esc(h.label || h.title)} ${h.live?'<span class="livetag">● LIVE</span>':""}</b><small>${esc(h.last_prompt || h.first || "")}</small></div>
    <span class="cwd" title="${esc(h.cwd)}">${esc(shortPath(h.cwd))}</span>
    <span class="when">${ago(h.mtime) === "now" ? "just now" : ago(h.mtime) + " ago"}${h.cost ? ` · <span class="cost" title="Cost recorded by Claude Code for this session: $${(+h.cost).toFixed(4)}">${fmtCost(h.cost)}</span>` : ""}</span>
    <span class="ha"><button class="btn sm" data-ha="chat">💬 Open</button><button class="btn sm ghost" data-ha="resume" title="Resume interactively in a new tmux window on the Linux box">↗ tmux</button><button class="btn sm ghost" data-ha="label" title="Rename">✎</button><button class="btn sm ghost" data-ha="pin">📌</button><button class="btn sm ghost" data-ha="totask" title="Add to board">→</button><button class="btn sm ghost" data-ha="hide" title="Hide">🙈</button></span>
  </div>`).join("");
  const html = `<div class="sec"><h4>Live (${live.length}) <span class="spacer"></span><button class="btn sm" data-sa="new">＋ New session</button></h4><div class="tiles">${tiles || '<div class="small">No live sessions.</div>'}</div></div>
    <div class="sec"><h4>History <span class="spacer"></span>
      <span class="chips">${["all","claude","codex"].map(a => `<button class="chip ${histAgent===a?"on":""}" data-hag="${a}">${a}</button>`).join("")}</span>
      <input id="histQ" placeholder="search past sessions…" value="${esc(histQ)}" style="width:220px"></h4>
      <div class="hist">${rows || '<div class="small" style="padding:12px">Loading…</div>'}</div></div>`;
  const el = $("#sessGrid"); if (force || el.dataset.html !== html){ const st = $("#sessions").scrollTop; el.innerHTML = html; el.dataset.html = html; $("#sessions").scrollTop = st }

$("#sessions").addEventListener("click", async e => {
  if (e.target.closest("[data-sa=new]")) return newSessionModal();
  const hag = e.target.dataset.hag; if (hag){ histAgent = hag; return renderSessions(true) }
  const tile = e.target.closest(".tile"), row = e.target.closest(".hrow");
  if (tile){
    const s = S.live.find(x => x.key === tile.dataset.k); const a = e.target.closest("[data-sa]")?.dataset.sa, key = e.target.dataset.key;
    if (key) await api("/api/session", {action:"keys", key:s.key, pane:s.pane, k:key});
    if (a === "open" || (!a && !key && !e.target.closest("input,button"))) return openPanel(s);
    if (a === "focus"){ await api("/api/session", {action:"focus", key:s.key, pane:s.pane}); toast({title:"Switched tmux to", body:s.where}) }
    if (a === "ack") await api("/api/session", {action:"ack", key:s.key});
    if (a === "end") await endSession(s);
    if (a === "pin") await api("/api/session", {action:"pin", key:s.key, value:!s.pinned});
    if (a === "totask") await pickCategory(cat => sessionToTask(s.key, cat), e.target);
  }
  if (row){
    const h = histCache.find(x => x.key === row.dataset.k); const a = e.target.closest("[data-ha]")?.dataset.ha; if (!a) return;
    if (a === "chat") return openPanel(h);
    if (a === "resume"){ if (h.live && !confirm("This session looks live already. Open a second copy?")) return; const r = await api("/api/session", {action:"resume", key:h.key, kind:h.kind, id:h.id, cwd:h.cwd, title:h.label||h.title, access:S.settings.access[h.kind] === "full" ? "full" : "standard"}); toast({title:"Resumed in tmux", body:`${h.label||h.title} → ${r.where}`, c:`var(--${h.kind})`}) }
    if (a === "label"){ const n = prompt("Name this session", h.label || h.title); if (n != null){ await api("/api/session", {action:"label", key:h.key, value:n}) } }
    if (a === "pin") await api("/api/session", {action:"pin", key:h.key, value:!h.pinned});
    if (a === "hide"){ await api("/api/session", {action:"hide", key:h.key, value:true}); toast({title:"Hidden", body:h.title, actions:[["Undo", () => api("/api/session", {action:"hide", key:h.key, value:false}).then(loadHistory)]]}) }
    if (a === "totask") await pickCategory(cat => sessionToTask(h.key, cat), e.target);
    loadHistory();
  }

});

function pickCategory(cb, anchor){
  closeMenu(); const r = anchor.getBoundingClientRect(); const m = document.createElement("div"); m.className = "menu";
  m.style.left = Math.min(r.left, innerWidth - 220) + "px"; m.style.top = r.bottom + 4 + "px";
  m.innerHTML = `<div class="small" style="padding:2px 8px">Add to column</div>` + S.categories.map(c => `<div class="mi" data-c="${c.id}"><span class="sdot" style="background:${c.color}"></span>${esc(c.name)}</div>`).join("");
  document.body.appendChild(m);
  m.onclick = async e => { const c = e.target.closest("[data-c]")?.dataset.c; if (c){ closeMenu(); await cb(c); refresh() } };
  setTimeout(() => document.addEventListener("mousedown", function o(e){ if (!m.contains(e.target)){ closeMenu(); document.removeEventListener("mousedown", o) } }), 0);
}

// ---------------------------------------------------------------- notifications
function notifyNew(){
  const items = attnItems().filter(i => !i.mine);
  const keys = new Set(items.map(i => i.key + "@" + Math.floor(i.since)));
  if (firstLoad){ keys.forEach(k => seenAttn.add(k)); firstLoad = false; LS.set("seenAttn", [...seenAttn].slice(-300)); return }
  for (const i of items){
    const k = i.key + "@" + Math.floor(i.since); if (seenAttn.has(k)) continue; seenAttn.add(k);
    if (i.why === "finished"){  // quiet: it waits in the strip; desktop note only when the tab is in the background
      if (LS.get("notif", false) && "Notification" in window && Notification.permission === "granted" && document.hidden) new Notification("agentboard · finished", {body:i.title, tag:i.key});
      continue }
    const actions = [];
    if (i.kind === "session" && i.s) actions.push(["Open", () => { setView("sessions"); openPanel(i.s) }]);
    if (i.kind === "task") actions.push(["Open", () => openDrawer(i.t.id)]);
    if (i.why === "review") actions.push(["✓ Approve", () => taskAction(i.t.id, "approve")]);
    toast({title:`${i.why === "finished" ? "✓ Finished" : i.why === "needs permission" ? "✋ Needs permission" : i.why === "question" ? "? Question" : i.why === "review" ? "Ready for review" : i.why}`, body:i.title, c:i.c, actions, sticky: true});
    if (LS.get("notif", false) && "Notification" in window && Notification.permission === "granted" && document.hidden){
      const n = new Notification(`agentboard · ${i.why}`, {body:i.title, tag:i.key}); n.onclick = () => { window.focus(); n.close() };
    }

    for (let i = 0; i < 7; i++){ const d = new Date(w); d.setDate(d.getDate() + i); if (d > today) break;
      const iso = pIso(d), g = PROG.days[iso], v = g ? m.of(g) : 0;

  const groupHTML = ([k, g]) => { const ids = [...new Set([...g.done, ...g.finished, ...g.new, ...Object.keys(g.worked)])], r = rank(g); ids.sort((a, b) => r(a) - r(b));
    return `<div class="pgroup"><h4>${esc(progGroup === "week" && !progDay ? "Week of " + pLabel(k, {month:"short", day:"numeric"}) : pLabel(k))}<span>${esc(pSummary(g))}</span></h4>${ids.map(id => rowHTML(id, g)).join("")}</div>` };
  const seg = (name, cur, opts) => `<div class="seg" data-pseg="${name}">${opts.map(([v, l]) => `<button data-v2="${v}" class="${cur === v ? "on" : ""}">${esc(l)}</button>`).join("")}</div>`;
  const keepX = $(".hmscroll")?.scrollLeft, first = !$(".hmscroll");
  el.innerHTML = `<div class="pwrap"><div class="pstats">
      ${stat(Object.keys(now_.worked).length, "cards worked on today")}${stat(Object.keys(week.worked).length, "worked on this week")}
      ${stat(week.finished.length, "finished this week", "Cards that reached Review for the first time")}${stat(week.done.length, "marked done this week")}
      ${stat(rev + ask, "waiting on you", `${rev} in Review, ${ask} with a question`)}</div>
    <div class="pcard"><div class="phead"><h3>${esc(PROG_METRICS[progMetric].label)} per day</h3>${seg("metric", progMetric, Object.entries(PROG_METRICS).map(([k, v]) => [k, v.label]))}</div>
      <div class="hmscroll">${matrixHTML()}</div>
      <div class="hmlegend">Less <i class="hm"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><i class="hm l4"></i> More</div></div>
    <div class="pcard"><div class="phead"><h3>${progDay ? esc(pLabel(progDay)) : "What moved"}</h3>${progDay ? `<button class="btn sm ghost" data-pall>× All days</button>` : seg("group", progGroup, [["day", "Day"], ["week", "Week"]])}</div>
      ${all.slice(0, progShown).map(groupHTML).join("") || `<div class="small">No card moved ${progDay ? "on this day" : "yet"}.</div>`}
      ${all.length > progShown ? `<button class="btn sm" data-pmore>Show more</button>` : ""}
      <div class="small" style="margin-top:8px">Counts the cards on this board. Finished means a card reached Review for the first time. Tokens leave out cache reads.</div></div></div>`;
  const sc = $(".hmscroll"); if (sc) sc.scrollLeft = first ? sc.scrollWidth : keepX;
}
async function loadProgress(){ PROG = await api("/api/progress"); renderProgress() }
setInterval(() => { if (view === "progress" && !$("#progress .hm:focus") && !document.hidden) loadProgress() }, 30000);
const hmTip = document.createElement("div"); hmTip.id = "hmTip"; hmTip.hidden = true; document.body.appendChild(hmTip);
function showHmTip(c){
  const d = c.dataset.day; if (!d) return; const g = PROG.days[d] || pMerge([]);
  hmTip.textContent = `${pLabel(d)}: ${pSummary(g)}`; hmTip.hidden = false;
  const r = c.getBoundingClientRect(); hmTip.style.left = Math.max(8, Math.min(innerWidth - hmTip.offsetWidth - 8, r.left + r.width / 2 - hmTip.offsetWidth / 2)) + "px"; hmTip.style.top = Math.max(8, r.top - hmTip.offsetHeight - 6) + "px";
}
$("#progress").addEventListener("pointerover", e => { const c = e.target.closest(".hm[data-day]"); if (c) showHmTip(c); else hmTip.hidden = true });
$("#progress").addEventListener("pointerleave", () => { hmTip.hidden = true });
$("#progress").addEventListener("focusin", e => { const c = e.target.closest(".hm[data-day]"); if (c) showHmTip(c) });
$("#progress").addEventListener("focusout", () => { hmTip.hidden = true });
$("#progress").addEventListener("click", e => {
  const day = e.target.closest(".hm[data-day]")?.dataset.day, card = e.target.closest("[data-pcard]")?.dataset.pcard, opt = e.target.closest("[data-v2]"), sg = opt?.closest("[data-pseg]")?.dataset.pseg;
  if (day){ progDay = progDay === day ? null : day; hmTip.hidden = true; renderProgress() }
  else if (card) openDrawer(card, "chat");
  else if (e.target.closest("[data-pall]")){ progDay = null; renderProgress() }
  else if (e.target.closest("[data-pmore]")){ progShown += 14; renderProgress() }
  else if (sg === "metric"){ progMetric = opt.dataset.v2; LS.set("progMetric", progMetric); renderProgress() }
  else if (sg === "group"){ progGroup = opt.dataset.v2; LS.set("progGroup", progGroup); progShown = 14; renderProgress() }
});
function setView(v){ view = v; LS.set("view", v); $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("#board").style.display = v === "board" ? "flex" : "none"; $("#rail").style.display = v === "board" ? "" : "none"; $("#sessions").style.display = v === "sessions" ? "block" : "none"; $("#progress").style.display = v === "progress" ? "block" : "none";
  if (v === "sessions") loadHistory(); if (v === "progress") loadProgress(); if (S) render() }
$("#tabs").onclick = e => { const b = e.target.closest("[data-v]"); if (b) setView(b.dataset.v) };
$("#autopilot").onchange = e => api("/api/settings", {autopilot:e.target.checked}).then(() => { toast({title: e.target.checked ? "Autopilot on" : "Autopilot off", body: e.target.checked ? "Agents will pick up 🤖 To-do cards (🔥 first)." : "Only cards you ▶ Run will start."}); refresh() });
$("#parMinus").onclick = () => api("/api/settings", {max_parallel:Math.max(1, S.settings.max_parallel - 1)}).then(refresh);
$("#parPlus").onclick = () => api("/api/settings", {max_parallel:Math.min(8, S.settings.max_parallel + 1)}).then(refresh);
$("#search").oninput = e => { q = e.target.value.toLowerCase().trim(); render() };
const THEME_BG = {light:"#f6f7f9", dark:"#0f1115"};
const themeMode = () => LS.get("theme", "") || "auto";
function applyTheme(mode){   // auto follows the device; light and dark are your choice, remembered in this browser
  const root = document.documentElement;
  if (mode === "light" || mode === "dark"){ root.dataset.theme = mode; LS.set("theme", mode) } else { delete root.dataset.theme; LS.set("theme", "") }
  const eff = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", THEME_BG[eff]);
  $$("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.themeSet === themeMode()));
}
$("#themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); applyTheme(cur === "dark" ? "light" : "dark") };
document.addEventListener("click", e => { const b = e.target.closest("[data-theme-set]"); if (b) applyTheme(b.dataset.themeSet) });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (themeMode() === "auto") applyTheme("auto") });
applyTheme(themeMode());
document.addEventListener("keydown", e => {
  if (["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){ if (e.key === "Escape") document.activeElement.blur(); return }
  if (e.key === "Escape"){ if ($("#scrim").classList.contains("on")) closeModal(); else if (openTask) closeDrawer(); else if (panel) closePanel(); closeMenu() }
  else if (e.key === "/"){ e.preventDefault(); $("#search").focus() }
  else if (e.key === "n"){ e.preventDefault(); setView("board"); const c = LS.get("lastCat") || S.categories[0].id; ($(`[data-qa="${c}"]`) || $("[data-qa]"))?.focus() }
  else if (e.key === "b") setView("board");
  else if (e.key === "s") setView("sessions");
  else if (e.key === "r") rulesModal();
  else if (e.key === "?") helpModal();
  else if (e.key === "]") openNext();
});
setView(view);
refresh().then(() => { const t = new URLSearchParams(location.search).get("task"); if (t) openDrawer(t) });
</script>
